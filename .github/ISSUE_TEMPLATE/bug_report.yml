name: Bug report
description: Report a reproducible problem in transientDTU.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Please use synthetic or de-identified data and remove credentials or private paths.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproducible example
      description: Include the smallest runnable example and complete error output.
      render: R
    validations:
      required: true
  - type: textarea
    id: session
    attributes:
      label: Session information
      description: Paste the output of sessionInfo().
      render: text
    validations:
      required: true
